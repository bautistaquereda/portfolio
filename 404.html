<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Page not found | Bautista Quereda</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .e404 { min-height: 100vh; display: grid; place-content: center; gap: 22px; padding: 32px 0; }
    .e404__code { font-family: "Jersey 15", var(--pixel); font-size: clamp(6rem, 22vw, 11rem); line-height: 0.85; text-shadow: 6px 6px 0 var(--shadow); }
    .e404__trace { font-family: var(--text); font-size: 1.3rem; line-height: 1.3; color: var(--dim); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 14px; }
    .e404__trace b { color: var(--fg); font-weight: 400; }
  </style>
</head>
<body>
  <main class="container e404">
    <p class="prompt">bautistaquereda@portfolio:<span class="tilde">~</span>$ <span>curl -i $REQUEST_URI</span></p>
    <h1 class="e404__code">404</h1>
<pre class="e404__trace"><b>Exception in thread "main" PageNotFoundException:</b> the page you're looking for doesn't exist.
    at Portfolio.route(Router.java:404)
    at Visitor.click(Browser.java:1)
<b>La página que buscás no existe.</b></pre>
    <div class="hero__cta">
      <a class="btn btn--cmd btn--cv" href="/">$ cd ~</a>
    </div>
  </main>
</body>
</html>
